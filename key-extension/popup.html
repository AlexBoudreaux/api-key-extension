<!DOCTYPE html>
<html>
<head>
    <title>API Key Garage</title>
    <style>
        body {
            width: 400px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .login-section, .key-section {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .key-item {
            padding: 10px;
            border: 1px solid #eee;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .error {
            color: red;
            margin: 5px 0;
        }
        .hidden {
            display: none;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
        }
        input {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Section -->
        <div id="loginSection" class="login-section">
            <h3>Login</h3>
            <input type="password" id="password" placeholder="Enter password">
            <button id="loginBtn">Login</button>
            <div id="loginError" class="error hidden"></div>
        </div>

        <!-- Key Management Section -->
        <div id="keySection" class="key-section hidden">
            <h3>API Keys</h3>
            <button id="lockBtn">Lock</button>
            
            <!-- Add Key Form -->
            <div>
                <input type="text" id="keyName" placeholder="Key Name">
                <input type="text" id="keyValue" placeholder="Key Value">
                <button id="addKeyBtn">Add Key</button>
            </div>

            <!-- Keys List -->
            <div id="keysList"></div>
        </div>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
